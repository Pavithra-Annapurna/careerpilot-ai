
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: careerpilot
      MYSQL_USER: careerpilot
      MYSQL_PASSWORD: careerpilot_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "3307:3306"
    volumes:
      - careerpilot_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcareerpilot_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  careerpilot_mysql:
